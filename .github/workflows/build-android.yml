name: Build — Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout afriverse-browser
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Resolve latest GeckoView version
        id: gv
        working-directory: android
        run: |
          set -euo pipefail
          META=$(curl -fsSL https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml)
          VERSION=$(echo "$META" | sed -n 's:.*<latest>\(.*\)</latest>.*:\1:p')
          if [ -z "$VERSION" ]; then
            VERSION=$(echo "$META" | grep -oE '<version>[^<]+' | tail -1 | sed 's/<version>//')
          fi
          echo "GeckoView version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.9 --no-daemon

      - name: Create release keystore
        working-directory: android
        run: |
          keytool -genkey -v \
            -keystore afriverse-alpha.keystore \
            -alias afriverse \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass afriverse-alpha \
            -keypass afriverse-alpha \
            -dname "CN=Afriverse Alpha, O=Afriverse, C=NG"

      - name: Build release APK
        working-directory: android
        env:
          AFRIVERSE_KEYSTORE_PATH: ${{ github.workspace }}/android/afriverse-alpha.keystore
          AFRIVERSE_KEYSTORE_PASSWORD: afriverse-alpha
          AFRIVERSE_KEY_ALIAS: afriverse
          AFRIVERSE_KEY_PASSWORD: afriverse-alpha
        run: |
          ./gradlew -PgeckoViewVersion=${{ steps.gv.outputs.version }} \
            :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          find android/app/build/outputs/apk/release -name "*.apk" -print -exec cp {} dist/afriverse-alpha-android.apk \;
          ls -lah dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          name: Afriverse Alpha ${{ github.ref_name }}
          body: |
            Afriverse Alpha — Android build (GeckoView engine).
            Sideload: enable "Install unknown apps" for your browser, then open the APK.
            Homepage: https://alpha.afriversedao.org
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (non-release runs)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: afriverse-alpha-android
          path: dist/
          retention-days: 7
