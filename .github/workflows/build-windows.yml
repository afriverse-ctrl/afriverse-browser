name: Build — Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      zen_version:
        description: 'Zen source version to build against'
        default: '1.21.16b'
        required: false

env:
  ZEN_VERSION: ${{ github.event.inputs.zen_version || '1.21.16b' }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 300

    steps:
      - name: Checkout afriverse-browser
        uses: actions/checkout@v4

      - name: Install MozillaBuild
        run: |
          $url = "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe"
          Invoke-WebRequest -Uri $url -OutFile MozillaBuildSetup.exe
          Start-Process -FilePath MozillaBuildSetup.exe -ArgumentList "/S" -Wait
        shell: pwsh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Zen source download
        uses: actions/cache@v4
        with:
          path: zen-source
          key: zen-source-${{ env.ZEN_VERSION }}-windows

      - name: Fetch Zen source
        run: bash scripts/fetch-zen.sh zen-source
        shell: bash

      - name: Apply Afriverse patches
        run: bash scripts/apply-patches.sh zen-source
        shell: bash

      - name: Bootstrap
        working-directory: zen-source
        run: python mach bootstrap --no-interactive --application-choice browser
        shell: bash

      - name: Build
        working-directory: zen-source
        run: python mach build
        shell: bash
        env:
          MOZCONFIG: ${{ github.workspace }}/configs/mozconfig

      - name: Package
        working-directory: zen-source
        run: python mach package
        shell: bash

      - name: Collect artifact
        run: |
          mkdir -p dist
          Get-ChildItem -Recurse -Path zen-source/obj-*/dist -Include "*.exe","*.zip","*.msi" | Copy-Item -Destination dist/
        shell: pwsh

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          name: Afriverse Alpha ${{ github.ref_name }}
          body: |
            Afriverse Alpha — Windows build.
            Based on Zen Browser ${{ env.ZEN_VERSION }} (Gecko/Firefox engine).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (non-release runs)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: afriverse-alpha-windows
          path: dist/
          retention-days: 7
