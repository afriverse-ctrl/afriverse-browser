<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab — Afriverse</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #10b981;
      --green-dark: #059669;
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo img {
      width: 48px;
      height: 48px;
      border-radius: 12px;
    }

    .logo span {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .search-form {
      width: 100%;
      max-width: 560px;
      position: relative;
    }

    .search-form input {
      width: 100%;
      padding: 0.875rem 3.5rem 0.875rem 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9999px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-form input:focus {
      border-color: var(--green);
    }

    .search-form button {
      position: absolute;
      right: 0.5rem;
      top: 50%;
      transform: translateY(-50%);
      background: var(--green);
      border: none;
      border-radius: 9999px;
      width: 2.25rem;
      height: 2.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      transition: background 0.15s;
    }

    .search-form button:hover { background: var(--green-dark); }

    .quick-links {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 560px;
    }

    .quick-links a {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9999px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.8125rem;
      font-weight: 500;
      transition: border-color 0.15s, color 0.15s;
    }

    .quick-links a:hover {
      border-color: var(--green);
      color: var(--text);
    }

    .greeting {
      font-size: 0.8125rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="chrome://afriverse/content/logo.svg" alt="Afriverse" onerror="this.style.display='none'" />
    <span>Afriverse</span>
  </div>

  <form class="search-form" action="https://www.google.com/search" method="get" target="_self">
    <input type="text" name="q" placeholder="Search or enter address..." autofocus autocomplete="off" />
    <button type="submit" aria-label="Search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/>
      </svg>
    </button>
  </form>

  <div class="quick-links">
    <a href="https://hub.afriversedao.org">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      Afriverse
    </a>
    <a href="https://hub.afriversedao.org/wallet">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/></svg>
      Wallet
    </a>
    <a href="https://hub.afriversedao.org/messages">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Messages
    </a>
    <a href="https://hub.afriversedao.org/earn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="1" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Earn
    </a>
  </div>

  <p class="greeting" id="greeting"></p>

  <script>
    const h = new Date().getHours();
    const label = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    document.getElementById('greeting').textContent = label + ' — welcome to Afriverse Alpha';
  </script>
</body>
</html>
